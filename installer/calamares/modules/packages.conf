---
backend: apt

# Remove live-only tools from the installed target. HDE packages remain
# installed, while Plasma remains a rescue session until native HDE is tested.
operations:
  - remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - calamares
      - calamares-settings-debian
      - hanabira-installer
